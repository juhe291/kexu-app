<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>课序 V8 · 完整交互原型</title>
<style>
:root{
  color-scheme:light;
  --bg:#dbe7f7;--canvas:#ffffff;--surface:#ffffff;--surface2:#eef4fd;
  --ink:#0d1930;--ink2:#22395f;--muted:#4c6690;--line:#d2e0f4;--line2:#b6cbe8;
  --accent:#1f5cf0;--accent-soft:#dfeaff;--danger:#d93c3c;--warn:#c4700b;--ok:#0c9a63;
  --accent-2:#00a6a0;--accent-3:#f08a17;--accent-4:#7b4dff;--accent-5:#e8476f;
  --grid-line:#d3e2f6;--grid-line-strong:#bfd2ec;
  --axis-w:56px;--col-w:104px;--px-min:1.5;
  --radius:12px;--radius-lg:16px;
  --shadow:0 14px 38px rgba(20,40,80,.12);
  --font:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  --tone:#4f7fbf;--tone-bg:#eaf1fb;--tone-line:#d3e1f2;--tone-ink:#345270;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1220;--canvas:#0d1728;--surface:#152134;--surface2:#1b2a40;
  --ink:#eaf1fb;--ink2:#c2d3e8;--muted:#8fa4bd;--line:#26374e;--line2:#374c67;
  --accent:#75adff;--accent-soft:#1d3560;--danger:#ff8585;--warn:#f0b264;--ok:#5fd6a8;
  --accent-2:#4fd6cf;--accent-3:#f0b264;--accent-4:#a99bff;--accent-5:#f18ba6;
  --grid-line:#22324a;--grid-line-strong:#30455f;
  --shadow:0 18px 44px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:none}
button{border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* ---------- 展示台（桌面预览） ---------- */
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:48px;padding:26px 24px}
.intro{width:248px;padding-top:52px;position:sticky;top:24px}
.intro .kicker{font-size:0.688rem;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.intro h1{font-size:1.688rem;line-height:1.3;letter-spacing:-.6px;font-weight:820;margin:12px 0 10px}
.intro p{font-size:0.781rem;color:var(--ink2);line-height:1.85;margin:0 0 14px}
.intro .tips{font-size:0.719rem;color:var(--muted);line-height:1.8;border-top:1px solid var(--line2);padding-top:12px}
.intro .palette{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}
.intro .palette i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.06)}
.device{width:392px;height:840px;max-width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}

/* ---------- 顶栏 / 底栏 ---------- */
.topbar{flex:none;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);z-index:6}
.logo{display:flex;align-items:center;gap:8px;font-size:1.125rem;font-weight:820;letter-spacing:-.3px}
.logomark{display:grid;grid-template-columns:repeat(2,7px);gap:3px}
.logomark i{width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.9}
.logomark i:nth-child(2){opacity:.55}.logomark i:nth-child(3){opacity:.7}.logomark i:nth-child(4){opacity:.4}
.topacts{display:flex;align-items:center;gap:4px}
.weekchip{font-size:0.719rem;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav{flex:none;height:62px;border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 4px 6px;z-index:6}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:0.656rem;font-weight:620;border-radius:9px}
.bottomnav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.bottomnav button.active{color:var(--accent);font-weight:800;background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* ---------- 页面容器 ---------- */
.viewport{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:var(--surface)}
.page{display:none;padding:18px 16px 30px}
.page.active{display:block}
.tt-page{padding:0;height:100%;display:none;flex-direction:column;background:var(--surface)}
.page{background:var(--surface)}
.tt-page.active{display:flex}

/* ---------- 通用排版 ---------- */
.eyebrow{font-size:0.75rem;color:var(--accent);font-weight:750;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.page-head h1{font-size:1.875rem;line-height:1.18;letter-spacing:-.7px;font-weight:830;margin:4px 0 0}
.page-head .meta{font-size:0.719rem;color:var(--muted);padding-bottom:5px;white-space:nowrap}
.lead{font-size:0.781rem;color:var(--muted);line-height:1.7;margin:0}
.section-title{font-size:1rem;font-weight:800;letter-spacing:-.1px;margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;padding-left:11px;color:var(--accent)}
.section-title::before{content:"";position:absolute;left:0;top:.24em;width:3px;height:1em;border-radius:2px;background:var(--accent)}
.section-title small{font-size:0.719rem;color:var(--muted);font-weight:500}
.page-head .meta{color:var(--accent-2);font-weight:700}
.home-week{color:var(--accent-2);font-weight:680}
.tt-weeklabel{color:var(--accent-2);font-weight:700}
.soft-divider{height:1px;background:var(--line);margin:14px 0}
.pill{font-size:0.656rem;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:5px;padding:3px 6px;white-space:nowrap}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.pill.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.grow{flex:1;min-width:0}
.btn{border-radius:10px;padding:10px 14px;font-size:0.813rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
html[data-theme="dark"] .btn-primary{color:#0f1a26}
.btn-ghost{border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.btn-danger{border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line2));color:var(--danger);background:transparent}
.btn-block{width:100%}
.button-row{display:flex;gap:9px;margin-top:14px}
.button-row .btn{flex:1}

/* 课程色块基类：只用柔和底色 + 边框，禁止左侧竖条 */
.tone{background:var(--tone-bg);border:1px solid var(--tone-line)}
.tone-name{color:color-mix(in srgb,var(--tone) 34%,var(--ink))}
.tone-meta{color:var(--tone-ink)}

/* ---------- 首页：即将开始 ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 14px}
.home-head h1{font-size:1.875rem;font-weight:830;letter-spacing:-.7px;margin:4px 0 0}
.home-week{font-size:0.719rem;color:var(--muted);padding-bottom:4px;text-align:right;line-height:1.5}
.hero{position:relative;display:block;width:100%;text-align:left;border-radius:var(--radius-lg);padding:15px 16px 14px;margin:0 0 8px;cursor:pointer;overflow:hidden;font-family:inherit;color:var(--ink)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:0.719rem;font-weight:680;color:var(--tone-ink)}
.hero-status{display:inline-flex;align-items:center;gap:7px}
.hero-dot{width:7px;height:7px;border-radius:50%;background:var(--tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 16%,transparent)}
.hero-count{font-variant-numeric:tabular-nums;font-weight:760;white-space:nowrap}
.hero-name{margin:11px 0 0;font-size:2rem;line-height:1.18;font-weight:820;letter-spacing:-.9px;color:color-mix(in srgb,var(--tone) 48%,var(--ink));overflow-wrap:anywhere}
.hero-name.size-m{font-size:1.688rem;letter-spacing:-.5px}
.hero-name.size-s{font-size:1.438rem;letter-spacing:-.2px;line-height:1.24}
.hero-time{margin-top:9px;font-size:1.188rem;font-weight:770;letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.hero-time small{font-size:0.781rem;font-weight:620;color:var(--tone-ink);letter-spacing:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:0.813rem;color:var(--tone-ink)}
.hero-meta span{display:inline-flex;align-items:center;gap:5px}
.hero-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--tone-line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.719rem;color:var(--tone-ink)}
.hero-foot b{font-weight:720}
.home-stats{display:flex;align-items:center;gap:11px;padding:10px 3px 4px;font-size:0.75rem;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.home-stats .stat{display:inline-flex;align-items:baseline;gap:3px;min-width:0}
.home-stats b{font-size:1.188rem;font-weight:830;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.home-stats .stat:nth-of-type(2) b{color:var(--accent-3)}
.home-stats .stat:nth-of-type(3) b{color:var(--accent-2)}
.home-stats em{font-style:normal;font-size:0.719rem;color:var(--muted)}
.home-stats .sep{width:1px;height:15px;background:var(--grid-line-strong);display:block;flex:none}

/* ---------- 首页：可折叠模块 ---------- */
.module{border-top:1px solid var(--line)}
.module:first-of-type{border-top:1px solid var(--line)}
.module-head{display:flex;align-items:center;gap:9px;width:100%;padding:15px 2px;text-align:left}
.module-ico{width:22px;height:22px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:0;color:var(--tone-ink)}
.module-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.module-title{font-size:1rem;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.module-count{font-size:0.719rem;color:var(--accent);font-weight:680;font-variant-numeric:tabular-nums}
.module-head .chev{margin-left:auto;color:var(--muted);transition:transform .18s ease;display:grid;place-items:center}
.module-head .chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.module.open .chev{transform:rotate(90deg)}
.module-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.module.open .module-wrap{grid-template-rows:1fr}
.module-inner{overflow:hidden}
.module-body{padding:0 2px 14px}
.module-body.plain{font-size:0.75rem;color:var(--muted)}

/* 今日日程 */
.agenda{display:flex;flex-direction:column}
.agenda-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:stretch}
.agenda-row:first-child{border-top:0;padding-top:2px}
.agenda-time{width:72px;flex:none;padding-top:3px;font-variant-numeric:tabular-nums}
.agenda-time b{display:block;font-size:0.875rem;font-weight:790;color:var(--accent);font-variant-numeric:tabular-nums}
.agenda-time span{display:block;font-size:0.656rem;color:var(--muted);margin-top:1px}
.agenda-card{flex:1;min-width:0;border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:10px}
.agenda-main{min-width:0;flex:1}
.agenda-name{font-size:0.844rem;font-weight:730;line-height:1.35;overflow-wrap:anywhere}
.agenda-meta{font-size:0.688rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 9px}
.check{width:22px;height:22px;flex:none;border-radius:50%;border:1.6px solid var(--line2);display:grid;place-items:center;color:transparent;font-size:0.75rem;font-weight:900}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.agenda-row.done .agenda-name{text-decoration:line-through;color:var(--muted)}
.agenda-row.done .agenda-card{opacity:.6}

/* 截止提醒 */
.deadline-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.deadline-row:first-child{border-top:0;padding-top:2px}
.deadline-main{flex:1;min-width:0}
.deadline-title{font-size:0.875rem;font-weight:730;overflow-wrap:anywhere;display:flex;align-items:flex-start;gap:7px}
.prio-dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:6px}
.prio-dot.high{background:var(--danger)}
.prio-dot.medium{background:var(--warn)}
.prio-dot.low{background:var(--muted)}
.deadline-meta{font-size:0.688rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.deadline-days{text-align:right;font-size:0.75rem;font-weight:760;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.deadline-days.urgent{color:var(--danger)}
.deadline-days.soon{color:var(--warn)}
.deadline-days small{display:block;font-size:0.625rem;color:var(--muted);font-weight:500;margin-top:1px}

/* 待安排 */
.inbox-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.inbox-row:first-child{border-top:0;padding-top:2px}
.inbox-main{flex:1;min-width:0}
.inbox-title{font-size:0.844rem;font-weight:700;overflow-wrap:anywhere}
.inbox-meta{font-size:0.688rem;color:var(--muted);margin-top:3px}
.mini-btn{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:0.719rem;font-weight:700;color:var(--accent);background:var(--surface);white-space:nowrap}

/* 长期目标 */
.goal-block{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface)}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:0.813rem;font-weight:730}
.goal-row span:last-child{color:var(--muted);font-size:0.719rem;font-weight:600}
.goal-sub{font-size:0.719rem;color:var(--muted);margin-top:4px}
.goal-bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:3px;background:var(--tone);width:25%}
.goal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:0.688rem;color:var(--muted)}

/* ---------- 待办 ---------- */
.filters{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:14px 0 2px}
.filters button{padding:10px 1px;border-bottom:2px solid transparent;color:var(--muted);font-size:0.781rem;font-weight:650}
.filters button.active{color:var(--accent);border-color:var(--accent);font-weight:780}
.task-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.task-main{flex:1;min-width:0}
.task-title{font-size:0.906rem;font-weight:750;line-height:1.4;overflow-wrap:anywhere}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:4px;font-size:0.688rem;color:var(--muted)}
.task-meta .course{font-weight:680;color:var(--tone-ink)}
.task-tags{display:flex;gap:5px;align-items:center}
.task-clear{color:var(--muted);font-size:0.688rem}
.task-inbox-note{font-size:0.656rem;color:var(--muted)}

/* ---------- 智能规划 ---------- */
.plan-focus{border-radius:12px;padding:13px 14px;margin-top:6px}
.plan-focus .eyebrow{color:var(--tone-ink)}
.plan-focus h2{font-size:1.063rem;font-weight:800;letter-spacing:-.2px;margin:6px 0 4px;color:color-mix(in srgb,var(--tone) 30%,var(--ink))}
.plan-focus p{margin:0;font-size:0.719rem;color:var(--tone-ink)}
.plan-block{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.plan-date{width:84px;flex:none;font-size:0.688rem;color:var(--muted);padding-top:2px}
.plan-date b{display:block;font-size:0.75rem;color:var(--accent);font-weight:760;margin-bottom:2px}
.plan-body{flex:1;min-width:0}
.plan-time{font-size:1rem;font-weight:780;letter-spacing:-.2px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plan-time small{font-size:0.688rem;color:var(--muted);font-weight:600;letter-spacing:0}
.plan-reason{font-size:0.719rem;color:var(--muted);margin-top:4px;line-height:1.65}
.plan-tag{display:inline-block;font-size:0.656rem;font-weight:700;color:var(--tone-ink);background:var(--tone-bg);border-radius:5px;padding:2px 6px;margin-top:6px}
.why-list{font-size:0.75rem;color:var(--ink2);line-height:1.95;padding-left:2px}
.why-list span{color:var(--muted)}

/* ---------- 设置 ---------- */
.settings-list{border-top:1px solid var(--line);margin-top:6px}
.group-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;border-bottom:1px solid var(--line);text-align:left}
.group-ico{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--tone-bg);color:var(--tone-ink);border:1px solid var(--tone-line)}
.group-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.group-main{flex:1;min-width:0}
.group-title{font-size:0.938rem;font-weight:780;letter-spacing:-.1px}
.group-sub{font-size:0.719rem;color:var(--muted);margin-top:2px;line-height:1.5;overflow-wrap:anywhere}
.chev{color:var(--muted);display:grid;place-items:center}
.chev svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subhead{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.backbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--surface)}
.backbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subhead h1{font-size:1.375rem;font-weight:830;letter-spacing:-.5px;margin:0}
.subhead .eyebrow{margin-left:auto;font-size:0.688rem}
.setting-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.setting-main{flex:1;min-width:0}
.setting-label{font-size:0.875rem;font-weight:720}
.setting-hint{font-size:0.688rem;color:var(--muted);margin-top:2px;line-height:1.5}
.setting-control{flex:none;display:flex;align-items:center;gap:6px}
.field{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:0.781rem;background:var(--surface);min-width:0;color:var(--ink)}
.field:focus{outline:2px solid var(--accent-soft)}
select.field{padding-right:6px}
.field.time{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.stepper button{width:28px;height:30px;color:var(--ink2);font-size:0.938rem;display:grid;place-items:center}
.stepper button:hover{background:var(--surface2)}
.stepper span{min-width:38px;text-align:center;font-size:0.781rem;font-variant-numeric:tabular-nums;font-weight:700}
.switch{width:42px;height:25px;border-radius:13px;background:var(--line2);position:relative;transition:background .15s ease;flex:none}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .15s ease}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px)}

<body>

      <button data-nav="timetable"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>课表</button>

    <div class="modal-head"><strong id="modalTitle">标题</strong><button class="modal-close" id="modalClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ===================== CORE-BEGIN（纯逻辑，可被 Node 测试抽取） ===================== */
const pad2 = (n) => String(n).padStart(2, '0');
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const DAY_MS = 86400000;
const WEEKDAY_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const PX_PER_MIN = 1.5;
const PERIOD_LIMIT = { min: 4, max: 20 };

const parseISODate = (s) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
};
const isoDate = (ms) => {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
};
const addDays = (ms, n) => ms + n * DAY_MS;
const startOfWeekMs = (ms) => {
  const wd = (new Date(ms).getUTCDay() + 6) % 7;
  return ms - wd * DAY_MS;
};
const fmtCN = (ms) => {
  const d = new Date(ms);
  return `${d.getUTCMonth() + 1} 月 ${d.getUTCDate()} 日`;
};
const monthLabel = (ms) => {
  const d = new Date(ms);
  return `${d.getUTCFullYear()} 年 ${d.getUTCMonth() + 1} 月`;
};
const dateForWeekDay = (semesterStart, week, weekday) =>
  startOfWeekMs(parseISODate(semesterStart)) + ((week - 1) * 7 + weekday) * DAY_MS;
const weekIndexForDate = (semesterStart, dateISO) => {
  const s = startOfWeekMs(parseISODate(semesterStart));
  const d = startOfWeekMs(parseISODate(dateISO));
  return Math.floor((d - s) / (7 * DAY_MS)) + 1;
};
const weekRangeLabel = (semesterStart, week) => {
  const monday = dateForWeekDay(semesterStart, week, 0);
  const sunday = addDays(monday, 6);
  const y1 = new Date(monday).getUTCFullYear(), y2 = new Date(sunday).getUTCFullYear();
  if (y1 !== y2) return `${y1} 年 ${fmtCN(monday)} — ${y2} 年 ${fmtCN(sunday)}`;
  return `${fmtCN(monday)} — ${fmtCN(sunday)}`;
};
const parityMatch = (parity, week) => {
  if (!parity || parity === 'all') return true;
  if (parity === 'odd') return week % 2 === 1;
  if (parity === 'even') return week % 2 === 0;
  return true;
};
const weeksInclude = (meeting, week) => {
  const w = meeting.weeks;
  if (w === undefined || w === 'all') return true;
  return Array.isArray(w) && w.includes(week);
};
const minutesOf = (hhmm) => {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
  return m ? +m[1] * 60 + +m[2] : NaN;
};
const timeOf = (min) => `${pad2(Math.floor(min / 60))}:${pad2(min % 60)}`;
const overlaps = (aStart, aEnd, bStart, bEnd) => aStart < bEnd && bStart < aEnd;
const formatDuration = (min) => {
  if (!Number.isFinite(min) || min <= 0) return '未设置时长';
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return `${m} 分钟`;
  return m ? `${h} 小时 ${m} 分钟` : `${h} 小时`;
};
const countdownText = (msLeft) => {
  if (!Number.isFinite(msLeft) || msLeft <= 0) return '即将开始';
  const min = Math.round(msLeft / 60000);
  if (min < 60) return `${min} 分钟后`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? `${h} 小时 ${m} 分后` : `${h} 小时后`;
  return `${Math.floor(h / 24)} 天后`;
};
const compressGap = (gapMin) => {
  if (!(gapMin > 0)) return 0;
  if (gapMin <= 10) return Math.max(3, gapMin * 0.5);
  return clamp(6 + gapMin * 0.18, 12, 30);
};
const gapLabel = (gapMin, fromMin) => {
  if (gapMin < 20) return '';
  const hour = Math.floor(fromMin / 60);
  if (hour >= 11 && hour < 15) return '午休';
  if (hour >= 16 && hour < 20) return '晚餐';
  return '休息';
};
const periodLayout = (periods, px = PX_PER_MIN) => {
  const dayStart = minutesOf(periods[0] && periods[0].from);
  let cursor = dayStart;
  let top = 0;
  const rows = [];
  periods.forEach((p, i) => {
    const from = minutesOf(p.from), to = minutesOf(p.to);
    const gapMin = i === 0 ? 0 : Math.max(0, from - cursor);
    const gapPx = compressGap(gapMin);
    top += gapPx;
    const height = Math.max(0, to - from) * px;
    rows.push({ index: i, from, to, fromMin: from, toMin: to, gapMin, gapPx, label: gapLabel(gapMin, from), top, height });
    top += height;
    cursor = to;
  });
  return { dayStart, rows, total: top, px };
};
const validatePeriods = (periods) => {
  const errors = [];
  if (!Array.isArray(periods) || periods.length < PERIOD_LIMIT.min || periods.length > PERIOD_LIMIT.max) {
    errors.push(`节次数量需在 ${PERIOD_LIMIT.min} 到 ${PERIOD_LIMIT.max} 之间`);
    return { ok: false, errors };
  }
  periods.forEach((p, i) => {
    const from = minutesOf(p.from), to = minutesOf(p.to);
    if (!Number.isFinite(from) || !Number.isFinite(to)) { errors.push(`第 ${i + 1} 节时间格式无效`); return; }
    if (from < 0 || to > 24 * 60) errors.push(`第 ${i + 1} 节需在一天之内`);
    if (to <= from) errors.push(`第 ${i + 1} 节的结束需晚于开始`);
    if (i > 0) {
      const prevTo = minutesOf(periods[i - 1].to);
      if (Number.isFinite(prevTo) && from < prevTo) errors.push(`第 ${i} 与 ${i + 1} 节时间重叠`);
    }
  });
  return { ok: errors.length === 0, errors };
};
const meetingRect = (periods, startPeriod, endPeriod, px = PX_PER_MIN) => {
  const layout = periodLayout(periods, px);
  const s = clamp(startPeriod - 1, 0, periods.length - 1);
  const e = clamp(endPeriod - 1, s, periods.length - 1);
  const top = layout.rows[s].top;
  const bottom = layout.rows[e].top + layout.rows[e].height;
  return { top, height: Math.max(bottom - top, 24) };
};

/* 课程颜色：柔和底色 + 可读文字色 */

    root.append(settingRow('每日学习上限', '超过上限时不再安排新任务', selectNode([[2, '2 小时'], [3, '3 小时'], [4, '4 小时'], [6, '6 小时']], s.dailyCapHours, (v) => { s.dailyCapHours = Number(v); saveSettings(); })));
    root.append(settingRow('自动预留休息', '两个时间块之间保留间隔', switchNode(s.restEnabled, (v) => { s.restEnabled = v; saveSettings(); renderSettings(); })));
    if (s.restEnabled) root.append(settingRow('休息间隔', '', selectNode([[10, '10 分钟'], [15, '15 分钟'], [20, '20 分钟']], s.restMinutes, (v) => { s.restMinutes = Number(v); saveSettings(); })));
  }
  function renderSettingsReminders(root) {
    const r = state.settings.reminders;
    const saveR = () => { save('settings', state.settings); };
    root.append(el('div', 'section-title', '提醒时间'));
    root.append(settingRow('上课前提醒', '', selectNode([[5, '提前 5 分钟'], [10, '提前 10 分钟'], [15, '提前 15 分钟'], [30, '提前 30 分钟']], r.courseBefore, (v) => { r.courseBefore = Number(v); saveR(); })));
    root.append(settingRow('任务开始提醒', '', selectNode([[0, '开始时'], [5, '提前 5 分钟'], [10, '提前 10 分钟'], [30, '提前 30 分钟']], r.taskBefore, (v) => { r.taskBefore = Number(v); saveR(); })));
    root.append(settingRow('截止日期提醒', '', selectNode([[0, '当天 09:00'], [1440, '提前 1 天'], [2880, '提前 2 天']], r.deadlineBefore, (v) => { r.deadlineBefore = Number(v); saveR(); })));
    root.append(el('div', 'section-title', '提醒方式'));
    root.append(settingRow('普通通知', '课程、任务开始与截止提醒', switchNode(r.notify, (v) => { r.notify = v; saveR(); })));
    root.append(settingRow('响铃式提醒', '仅对重要事项使用，避免打扰', switchNode(r.alarm, (v) => { r.alarm = v; saveR(); })));
    root.append(settingRow('提醒声音', '', selectNode([['默认提示音', '默认提示音'], ['轻柔', '轻柔'], ['简短', '简短'], ['静音', '静音']], r.sound, (v) => { r.sound = v; saveR(); })));
    root.append(settingRow('振动', '', switchNode(r.vibrate, (v) => { r.vibrate = v; saveR(); })));
  }
  function renderSettingsAppearance(root) {
    root.append(el('div', 'section-title', '显示模式'));
    const modes = el('div', '');
    modes.append(segNode([['light', '浅色'], ['dark', '深色'], ['system', '跟随系统']], state.theme, (v) => { state.theme = v; save('theme', v); applyTheme(); renderAll(); }));
    root.append(settingRow('主题模式', '深色模式会同步调整课程色块的底色与文字对比度', modes));
    root.append(el('div', 'section-title', '主题强调色'));
    const accentGrid = el('div', 'swatch-grid');
    ['#2f5f8f', '#2f8577', '#6b5bb5', '#a8773b', '#a85c71', '#5c6b7a'].forEach((hex) => {
      const b = el('button', '');
      b.style.background = hex;
      if (hex.toLowerCase() === String(state.accent).toLowerCase()) b.classList.add('on');
      b.setAttribute('aria-label', '强调色 ' + hex);
      b.addEventListener('click', () => { state.accent = hex; save('accent', hex); applyTheme(); renderAll(); });
      accentGrid.append(b);
    });
    root.append(accentGrid);
    root.append(settingRow('课程配色管理', '每门课程可单独设置颜色', (() => { const b = el('button', 'mini-btn', '去设置'); b.addEventListener('click', () => { state.settingsPage = 'course'; renderSettings(); }); return b; })()));
  }
  function renderSettingsData(root) {
    root.append(el('div', 'section-title', '备份与恢复'));
    const row = el('div', 'button-row');
    const exportBtn = el('button', 'btn btn-ghost', '导出全部数据');
    exportBtn.addEventListener('click', exportAllData);
    const importBtn = el('button', 'btn btn-ghost', '从文件恢复');
    importBtn.addEventListener('click', importAllData);
    row.append(exportBtn, importBtn);
    root.append(row);

    root.append(el('div', 'section-title', '备份管理'));
    const backups = load('backups', []);
    if (!backups.length) root.append(el('p', 'note', '还没有备份。导出数据时会自动保存一份本地备份。'));
    backups.forEach((b) => {
      const r = el('div', 'setting-row');
      const main = el('div', 'setting-main');
      main.append(el('div', 'setting-label', `${b.label || '手动备份'}`), el('div', 'setting-hint', new Date(b.at).toLocaleString('zh-CN')));
      const ctrl = el('div', 'setting-control');
      const restore = el('button', 'mini-btn', '恢复');
      restore.addEventListener('click', () => confirmDialog('恢复备份', '会覆盖当前数据，确定继续吗？', '恢复', () => { applyPayload(b.payload); toast('已恢复备份'); }));
      const del = el('button', 'mini-btn', '删除');
      del.addEventListener('click', () => { save('backups', load('backups', []).filter((x) => x.id !== b.id)); renderSettings(); });
      ctrl.append(restore, del);
      r.append(main, ctrl);
      root.append(r);
    });

    root.append(el('div', 'section-title', '检查与清除'));
    root.append(settingRow('运行自检', '验证日期、教学周、单双周、时间轴与配色的核心逻辑', (() => { const b = el('button', 'mini-btn', '运行'); b.addEventListener('click', showSelfTest); return b; })()));
    const clear = el('button', 'btn btn-danger btn-block', '清除本地数据');
    clear.style.marginTop = '12px';
    clear.addEventListener('click', () => confirmDialog('清除数据', '会删除全部课程、任务与设置，且无法撤销。', '继续', () => {
      confirmDialog('再次确认', '确定要清空本机上的课序数据吗？', '清空并重置', () => {
        Object.keys(localStorage).filter((k) => k.startsWith(KEY)).forEach((k) => localStorage.removeItem(k));
        location.reload();
      }, true);
    }, true));
    root.append(clear);
  }

  function openAboutDialog() {
    const nodes = [];
    nodes.push(el('p', 'note', '课序 V8.2 · 单文件 HTML 交互原型，用于演示界面与交互，不是 Android 安装包。'));
    [
      ['数据与隐私', '所有数据保存在本机浏览器 localStorage，不联网、不上传。'],
      ['演示时间', '固定为 2026-10-26（第 8 教学周）07:40 起逐秒推进，保证倒计时与长图可复现。'],
      ['课程颜色', '每门课程一个颜色，首页、今日日程、周课表、待办与规划结果统一使用；修改后立即同步。'],
      ['课表交互', '日期栏纵向固定，横向滑动查看整周；节次时间轴在「设置 → 课程与学期」中修改。'],
      ['折叠与偏好', '首页五个折叠模块的展开状态、深色模式与强调色都会记住。'],
      ['智能规划', '当前为固定示例方案；正式版接入约束检测、动态优先级与最小扰动重排。'],
      ['提醒与导入', '提醒/闹钟目前只保存偏好；导入导出支持本应用 JSON，CSV/ICS 与外部 AI 导入在正式版接入。']
    ].forEach(([title, desc]) => {
      const row = el('div', 'about-row');
      row.append(el('strong', '', title), el('p', '', desc));
      nodes.push(row);
    });
    const close = el('button', 'btn btn-primary btn-block', '知道了');
    close.addEventListener('click', closeModal);
    nodes.push(close);
    openModal('使用说明与关于', nodes);
  }

  /* ---------- 数据导入导出 ---------- */
  const download = (filename, data) => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 600);
  };
  const payloadOf = () => ({ app: 'kexu', version: 8, exportedAt: new Date().toISOString(), semester: state.semester, periods: state.periods, courses: state.courses, tasks: state.tasks, inbox: state.inbox, goals: state.goals, settings: state.settings });
  const addBackup = (payload) => {
    const list = load('backups', []);
    list.unshift({ id: 'b' + Date.now(), at: Date.now(), label: '导出备份 ' + new Date().toLocaleDateString('zh-CN'), payload });
    save('backups', list.slice(0, 8));
  };
  const exportAllData = () => { const payload = payloadOf(); addBackup(payload); download('课序备份_' + civil().iso + '.json', payload); toast('已导出数据并保存本地备份'); renderSettings(); };
  const exportTimetable = () => { const payload = { app: 'kexu-timetable', version: 8, semester: state.semester, periods: state.periods, courses: state.courses }; download('课序课表_' + civil().iso + '.json', payload); toast('课表已导出'); };
  const applyPayload = (payload) => {
    if (!payload || typeof payload !== 'object') return false;
    if (payload.semester && payload.semester.startDate) state.semester = { ...state.semester, ...payload.semester };
    if (Array.isArray(payload.periods) && CORE.validatePeriods(payload.periods).ok) state.periods = payload.periods;
    if (Array.isArray(payload.courses)) state.courses = payload.courses;
    if (Array.isArray(payload.tasks)) state.tasks = payload.tasks;
    if (Array.isArray(payload.inbox)) state.inbox = payload.inbox;
    if (Array.isArray(payload.goals)) state.goals = payload.goals;
    if (payload.settings) state.settings = { ...state.settings, ...payload.settings };
    state.weekOffset = 0; state.dayIndex = CORE.clamp(civil().weekday, 0, 6);
    persist(); renderAll();
    return true;
  };
  const pickFile = (onFile) => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    input.addEventListener('change', () => { const f = input.files && input.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => onFile(String(reader.result || '')); reader.readAsText(f, 'utf-8'); });
    input.click();
  };
  const importAllData = () => pickFile((text) => { try { const data = JSON.parse(text); confirmDialog('恢复数据', '导入会覆盖当前课程、节次、任务与设置，确定继续吗？', '导入', () => { applyPayload(data); toast('数据已恢复'); }); } catch (e) { toast('文件不是有效的 JSON'); } });
  const importTimetable = () => pickFile((text) => { try { const data = JSON.parse(text); if (!Array.isArray(data.courses)) throw new Error('缺少 courses'); confirmDialog('导入课表', `将导入 ${data.courses.length} 门课程与 ${(data.periods || []).length} 个节次，覆盖当前课表？`, '导入', () => { applyPayload(data); toast('课表已导入'); }); } catch (e) { toast('课表文件格式不正确'); } });

  /* ---------- 自检 ---------- */
  function showSelfTest() {
    const results = CORE.runSelfTests();
    const pass = results.filter((r) => r.ok).length;
    const nodes = [];
    const summary = el('p', 'note', `共 ${results.length} 项检查，通过 ${pass} 项${pass === results.length ? '。' : '，请检查未通过项。'}`);
    nodes.push(summary);
    const wrap = el('div', '');
    results.forEach((r) => {
      const line = el('div', 'setting-row');
      line.style.padding = '7px 0';
      const main = el('div', 'setting-main'); main.append(el('div', 'setting-label', r.name));
      if (!r.ok && r.detail) main.append(el('div', 'setting-hint', r.detail));
      line.append(main, el('span', 'pill ' + (r.ok ? '' : 'danger'), r.ok ? '通过' : '失败'));
      wrap.append(line);
    });
    nodes.push(wrap);
    openModal('逻辑自检', nodes);
  }

  /* ---------- 新建任务 ---------- */
  function openTaskDialog() {
    const nodes = [];
    const title = inputNode('text', '', () => {}, { placeholder: '需要完成什么？' });
    title.maxLength = 80;
    nodes.push(el('div', 'fieldlabel', '任务标题'), title);
    const courseSel = selectNode([['', '不关联课程'], ...state.courses.map((c) => [c.id, c.name])], '', () => {});
    nodes.push(el('div', 'fieldlabel', '关联课程'), courseSel);
    const prioritySeg = segNode([['low', '低'], ['medium', '中'], ['high', '高']], state.settings.defaultPriority, () => {});
    nodes.push(el('div', 'fieldlabel', '优先级'), prioritySeg);
    const minutesSel = selectNode([[25, '25 分钟'], [45, '45 分钟'], [60, '60 分钟'], [90, '90 分钟'], [120, '120 分钟']], state.settings.defaultTaskMinutes, () => {});
    nodes.push(el('div', 'fieldlabel', '预计时长'), minutesSel);
    const deadline = inputNode('date', '', () => {});
    nodes.push(el('div', 'fieldlabel', '截止日期（可选）'), deadline);
    const planRow = el('div', '');
    planRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:2px';
    const daySel = selectNode(CORE.WEEKDAY_CN.map((label, i) => [String(i), label]), String(civil().weekday), () => {});
    const start = timeInput('', () => {});
    const end = timeInput('', () => {});
    planRow.append(daySel, start, end);
    nodes.push(el('div', 'fieldlabel', '计划时间（留空则进入待安排）'), planRow);
    const save = el('button', 'btn btn-primary btn-block', '保存任务');
    nodes.push(save);
    save.addEventListener('click', () => {
      const name = title.value.trim();
      if (!name) { toast('请填写任务标题'); title.focus(); return; }
      const a = start.value, b = end.value;
      if (!!a !== !!b) { toast('开始与结束时间需要同时填写'); return; }
      if (a && CORE.minutesOf(b) <= CORE.minutesOf(a)) { toast('结束时间需晚于开始时间'); return; }
      const weekday = Number(daySel.value);
      const priority = (prioritySeg.querySelector('button.on') || { textContent: '中' }).textContent === '高' ? 'high' : (prioritySeg.querySelector('button.on') || { textContent: '中' }).textContent === '低' ? 'low' : 'medium';
      const task = { id: 'n' + Date.now(), title: name, courseId: courseSel.value || null, priority, estimatedMinutes: Number(minutesSel.value), deadline: deadline.value || null, done: false, source: 'manual' };
      if (a) {
        if (weekday !== civil().weekday) {
          // 允许安排到本周其他日期
        }
        if (weekday === civil().weekday) {
          const conflict = CORE.coursesOnDay(state.courses, currentWeek(), weekday).find(({ meeting }) => CORE.overlaps(CORE.minutesOf(a), CORE.minutesOf(b), CORE.minutesOf(state.periods[meeting.startPeriod - 1].from), CORE.minutesOf(state.periods[meeting.endPeriod - 1].to)));
          if (conflict) { toast('与课程冲突：' + conflict.course.name); return; }
          const taskConflict = tasksOf(currentWeek(), weekday).find((t) => CORE.overlaps(CORE.minutesOf(a), CORE.minutesOf(b), CORE.minutesOf(t.from || '00:00'), CORE.minutesOf(t.to || '00:00')));
          if (taskConflict) { toast('与已有任务冲突：' + taskConflict.title); return; }
        }
        state.tasks.push({ ...task, week: currentWeek(), weekday, from: a, to: b });
      } else {
        state.inbox.push({ ...task, note: '手动添加 · 尚未安排' });
      }
      persist(); closeModal(); renderAll(); switchView('home'); toast(a ? '任务已加入日程' : '任务已保存到待安排');
    });
    openModal('新建任务', nodes);
  }

  /* ---------- 视图切换与初始化 ---------- */
  function switchView(view, opts = {}) {
    state.view = view;
    document.querySelectorAll('.page').forEach((p) => p.classList.toggle('active', p.dataset.view === view));
    document.querySelectorAll('[data-nav]').forEach((b) => b.classList.toggle('active', b.dataset.nav === view));
    const viewport = $('#viewport');
    viewport.classList.toggle('no-scroll', false);
    if (view === 'home') renderHome();
    if (view === 'timetable') renderTimetable(false);
    if (view === 'tasks') renderTasks();
    if (view === 'planning') renderPlanning();
    if (view === 'settings') { if (opts.resetSettings) state.settingsPage = 'root'; renderSettings(); }
    if (!opts.keepScroll) viewport.scrollTop = 0;
    $('#topWeek').textContent = `第 ${currentWeek()} 周`;
  }
  function renderAll() {
    applyTheme();
    $('#topWeek').textContent = `第 ${currentWeek()} 周`;
    renderHome(); renderTimetable(); renderTasks(); renderPlanning(); renderSettings();
    renderIntroPalette();
  }
  function renderIntroPalette() {
    const host = $('#introPalette'); if (!host) return;
    host.replaceChildren();
    state.courses.slice(0, 7).forEach((c) => { const i = el('i'); i.style.background = c.color; i.title = c.name; host.append(i); });
  }
  function init() {
    const params = new URLSearchParams(location.search);
    if (params.get('shot') === '1') document.documentElement.classList.add('shot');
    if (params.get('wide') === '1') document.documentElement.classList.add('shot-wide');
    if (params.get('theme') === 'dark' || params.get('theme') === 'light') state.theme = params.get('theme');
    if (params.get('expand') === '1') state.modules = { agenda: true, deadline: true, inbox: true, goal: true, done: true };
    applyTheme();

    document.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.nav, { resetSettings: true })));
    $('#quickAdd').addEventListener('click', openTaskDialog);
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', (e) => { if (e.target === $('#modalBackdrop')) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'system') { applyTheme(); renderAll(); } });
    let resizeTimer = null;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.view === 'timetable') renderTimetable(); }, 180); });
    setInterval(() => {
      if (state.view !== 'home') return;
      const hero = document.querySelector('.hero[data-target]');
      if (!hero) return;
      const left = Number(hero.dataset.target) - demoNow().getTime();
      const count = hero.querySelector('.hero-count');
      if (count) count.textContent = left > 0 ? CORE.countdownText(left) : '即将开始';
      if (left < -60000) renderHome();
    }, 20000);

    const view = params.get('view');
    const group = params.get('group');
    renderAll();
    switchView(view && ['home', 'timetable', 'tasks', 'planning', 'settings'].includes(view) ? view : 'home', { keepScroll: true });
    if (group && state.view === 'settings') { state.settingsPage = group; renderSettings(); }
    if (params.get('selftest') === '1') showSelfTest();
    window.__KEXU = { state, CORE, demoNow, civil, currentWeek, displayWeek };
    requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.classList.add('ready'); window.__KEXU_READY = true; }));
  }
  init();
})();
</script>
</body>
</html>
